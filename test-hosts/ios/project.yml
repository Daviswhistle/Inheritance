name: InheritanceTestHost
options:
  deploymentTarget:
    iOS: '16.0'
configs:
  Debug: debug
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: org.inheritance.testhost
    TARGETED_DEVICE_FAMILY: '1,2'
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  InheritanceTestHost:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Inheritance TEST
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSLocalNetworkUsageDescription: Connect to your computer's local Inheritance test server.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  InheritanceHostUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: InheritanceTestHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: InheritanceTestHost
schemes:
  InheritanceTestHost:
    build:
      targets:
        InheritanceTestHost: all
    test:
      config: Debug
      targets: [InheritanceHostUITests]
    run:
      config: Debug
    profile:
      config: Debug
    archive:
      config: Debug
