name: Deploy operator gas refill

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "gas-refill/**"
      - "scripts/test-gas-refill.mjs"
      - "scripts/lib/gas-refill-test-storage.mjs"
      - "test/mocks/MockGasRefill.sol"
      - ".github/workflows/deploy-gas-refill.yml"
  workflow_dispatch:
    inputs:
      enabled:
        description: Enable the separately funded operator refill service
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

concurrency:
  group: gas-refill-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy bounded USDC refill
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GAS_REFILL_PRIVATE_KEY: ${{ secrets.GAS_REFILL_PRIVATE_KEY }}
      GAS_REFILL_ENABLED: ${{ inputs.enabled || vars.GAS_REFILL_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.2
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile local protocol fixtures
        run: forge build
      - name: Verify bounded exchange and durable recovery on Anvil
        run: node scripts/test-gas-refill.mjs
      - name: Check Worker syntax
        run: |
          node --check gas-refill/src/refill.mjs
          node --check gas-refill/src/worker.mjs
      - name: Deploy gas refill Worker
        run: |
          set -euo pipefail
          test -n "$GAS_REFILL_PRIVATE_KEY" || { echo "::error::Dedicated GAS_REFILL_PRIVATE_KEY is required."; exit 1; }
          case "$GAS_REFILL_ENABLED" in true|false) ;; *) echo "::error::Invalid refill enable flag."; exit 1 ;; esac
          npx wrangler@4.147.0 deploy --config gas-refill/wrangler.toml --var "GAS_REFILL_ENABLED:$GAS_REFILL_ENABLED"
          printf '%s' "$GAS_REFILL_PRIVATE_KEY" | npx wrangler@4.147.0 secret put GAS_REFILL_PRIVATE_KEY --config gas-refill/wrangler.toml
      - name: Verify deployed read-only health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 180 --max-time 20 \
            "https://world-inheritance-gas-refill.rkddkwl725.workers.dev/api/health?deployment=${GITHUB_SHA}&attempt=${GITHUB_RUN_ATTEMPT}" > /tmp/gas-refill-health.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('/tmp/gas-refill-health.json','utf8'));
          if (health.status !== 'ok' || health.version !== 'gas-refill-usdc-1' ||
              health.gasRefill?.enabled !== (process.env.GAS_REFILL_ENABLED === 'true')) {
            throw new Error('Refill Worker health or enable flag differs from this deployment');
          }
          console.log(JSON.stringify({status:health.status,enabled:health.gasRefill.enabled,reason:health.gasRefill.reason}));
          JS
