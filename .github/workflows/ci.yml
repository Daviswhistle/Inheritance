name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned on purpose. forge fmt rules and compiler output both drift between
      # releases, and this project has contracts deployed to World Chain mainnet
      # that were built with 1.3.2. Bumping the toolchain changes the deployed
      # bytecode, so it has to be a deliberate, reviewed change rather than a
      # side effect of an unpinned "latest".
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.2

      - name: Show Forge version
        run: forge --version

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

  app:
    name: Mini App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # 정의가 없는 className 은 빌드도 타입체크도 린트도 통과하고 화면에서는
      # 아무 일도 일어나지 않는다. 실제로 .bg-black/50 때문에 모달 배경이
      # 없고 .font-medium 때문에 제목이 굵어지지 않았다.
      - name: Check CSS classes are defined
        run: node ../scripts/check-css-classes.mjs

      - name: Build
        run: pnpm build

  backend:
    name: Notification backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check worker
        run: node --check src/worker.mjs

      # 순수 결정 함수만으로는 DB 쓰기 경로가 비어 있다. saveWatcher 가 자리표시자
      # 13개에 바인딩 12개를 주고도 이 테스트는 통과했다 — 실제 D1 은 매번 거절했고,
      # 그래서 알림 기능 전체가 죽어 있었는데 아무도 몰랐다.
      - name: Test notification DB writes
        run: node ../scripts/test-notify-db.mjs

  # 브라우저 하네스는 여기서 돌리지 않는다 — Chrome 이 필요하고 anvil/vite 를 띄워야
  # 해서 CI 와 로컬의 결과가 어긋난다. 로컬에서 scripts/verify/run.sh 로 돌린다.
  # (주키esten 은 알림 payload 검사까지 CI 에서 돈다)
