name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned on purpose. forge fmt rules and compiler output both drift between
      # releases, and this project has contracts deployed to World Chain mainnet
      # that were built with 1.3.2. Bumping the toolchain changes the deployed
      # bytecode, so it has to be a deliberate, reviewed change rather than a
      # side effect of an unpinned "latest".
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.2

      - name: Show Forge version
        run: forge --version

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      # revert 를 이름으로 해독하려면 ABI 에 커스텀 에러 항목이 있어야 한다. 예전에
      # 이게 없어서 ethers 가 revert 를 4바이트 셀렉터로만 남겼고, 사용자에게
      # `execution reverted (unknown custom error) (action=…, transaction={…})` 가
      # 그대로 나갔다. 계약이 바뀌면 생성물도 함께 바뀌어야 하므로 여기서 확인한다.
      - name: Generate custom error ABI
        run: node scripts/gen-abi-errors.mjs --check

  app:
    name: Mini App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Worker execution dependencies for shared auth tests
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test server sessions, notification authorization and durable dedupe
        run: node ../scripts/test-notify-auth.mjs

      # 정의가 없는 className 은 빌드도 타입체크도 린트도 통과하고 화면에서는
      # 아무 일도 일어나지 않는다. 실제로 .bg-black/50 때문에 모달 배경이
      # 없고 .font-medium 때문에 제목이 굵어지지 않았다.
      - name: Check CSS classes are defined
        run: node ../scripts/check-css-classes.mjs

      # revert 문장화 검증. 실제 인코딩된 revert 데이터를 넣고 무엇이 나오는지 본다.
      # tsc 와 vite build 는 이 경로를 검사하지 않는다 — 예전 버그가 그 둘을 통과했다.
      - name: Revert messages are human sentences
        run: node ../scripts/test-error-text.mjs

      - name: Validate dated yield rates and exclude verified-human boosts
        run: node ../scripts/test-yield-rates.mjs

      - name: Resolve user operations and verify canonical transaction outcomes
        run: node ../scripts/test-transaction-confirmation.mjs

      - name: Verify unified plans, protected income receipts and legacy route configuration
        run: |
          node ../scripts/verify/unified-plan.mjs
          node ../scripts/test-legacy-yield-routes.mjs

      # supported_languages 는 ["en"] 뿐이다. 알림 발송 실패 안내(가장 중요한 실패
      # 경로)가 한국어였고, 코드 주석도 한국어라 검토자가 놓쳤다. 사용자 노출 문자열만 본다.
      - name: No Korean on screen (source)
        run: node ../scripts/check-no-cjk.mjs

      - name: Build
        run: pnpm build

      # 빌드된 번들도 본다 — minify 이후 형태를 소스 검사만으로는 못 잡는다.
      - name: No Korean on screen (built bundle)
        working-directory: app
        run: node ../scripts/check-no-cjk.mjs


  backend:
    name: Notification backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker execution dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Install app dependencies for ABI verification
        working-directory: app
        run: pnpm install --frozen-lockfile

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.2

      - name: Validate contract-enforced automated transfers on Anvil
        working-directory: .
        run: forge build && node scripts/test-finalizer.mjs

      - name: Verify opt-in yield ABI and minimum-output contract
        working-directory: .
        run: |
          node scripts/test-yield-abi.mjs
          node scripts/test-rewards.mjs

      - name: Syntax check worker
        run: |
          node --check src/worker.mjs
          node --check src/runtime.mjs

      - name: Verify scheduled execution boundary and package Worker runtime
        working-directory: .
        run: |
          node scripts/test-worker-runtime.mjs
          npx wrangler deploy --dry-run --config backend/wrangler.toml

      - name: Test notification decision logic
        run: node ../scripts/test-notify-alerts.mjs

      # 순수 결정 함수만으로는 DB 쓰기 경로가 비어 있다. saveWatcher 가 자리표시자
      # 13개에 바인딩 12개를 주고도 이 테스트는 통과했다 — 실제 D1 은 매번 거절했고,
      # 그래서 알림 기능 전체가 죽어 있었는데 아무도 몰랐다.
      - name: Test notification DB writes
        run: node ../scripts/test-notify-db.mjs

  # 브라우저 하네스는 여기서 돌리지 않는다 — Chrome 이 필요하고 anvil/vite 를 띄워야
  # 해서 CI 와 로컬의 결과가 어긋난다. 로컬에서 scripts/verify/run.sh 로 돌린다.
  # (주키esten 은 알림 payload 검사까지 CI 에서 돈다)
