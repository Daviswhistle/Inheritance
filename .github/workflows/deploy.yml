name: Deploy mini app (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "backend/**"
      - "scripts/test-notify-alerts.mjs"
      - "scripts/test-notify-db.mjs"
      - "scripts/test-notify-auth.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  auth:
    name: Validate auth and prepare shared D1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install auth test dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Install Worker execution dependencies
        run: npm ci --no-audit --no-fund
      - name: Test session, nonce replay, API authorization and persisted delivery history
        run: node scripts/test-notify-auth.mjs
      # Both deployments wait for the shared schema and the same session secret.
      # Secrets are passed through stdin; never echo their values or enable shell tracing.
      - name: Prepare D1 and shared session secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SIWE_SECRET: ${{ secrets.SIWE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$SIWE_SECRET" ]; then
            echo "::error::Repository secret SIWE_SECRET is required for Pages and the notification Worker."
            exit 1
          fi
          npx wrangler d1 migrations apply world-inheritance-notify --remote --config backend/wrangler.toml
          printf '%s' "$SIWE_SECRET" | npx wrangler secret put SIWE_SECRET --config backend/wrangler.toml
          printf '%s' "$SIWE_SECRET" | npx wrangler pages secret put SIWE_SECRET --project-name inheritance --config app/wrangler.toml

  deploy:
    name: Build & deploy to Pages
    needs: auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install deps
        working-directory: app
        run: pnpm install --frozen-lockfile

      # app/.env 는 gitignore 대상이라 CI 에 없다. 공개 온체인 정보만 여기서 주입한다.
      # (개인키 등 비공개 값은 절대 넣지 않는다)
      - name: Build
        working-directory: app
        env:
          VITE_FACTORY_ADDRESS: ${{ vars.VITE_FACTORY_ADDRESS }}
          VITE_WLD_ADDRESS: ${{ vars.VITE_WLD_ADDRESS }}
          VITE_RPC: ${{ vars.VITE_RPC }}
          VITE_FACTORY_DEPLOY_BLOCK: ${{ vars.VITE_FACTORY_DEPLOY_BLOCK }}
          VITE_LEGACY_FACTORY_ADDRESS: ${{ vars.VITE_LEGACY_FACTORY_ADDRESS }}
          VITE_LEGACY_FACTORY_DEPLOY_BLOCK: ${{ vars.VITE_LEGACY_FACTORY_DEPLOY_BLOCK }}
          VITE_YIELD_FACTORY_ADDRESS: ${{ vars.VITE_YIELD_FACTORY_ADDRESS }}
          VITE_YIELD_FACTORY_DEPLOY_BLOCK: ${{ vars.VITE_YIELD_FACTORY_DEPLOY_BLOCK }}
          VITE_MORPHO_VAULT_ADDRESS: ${{ vars.VITE_MORPHO_VAULT_ADDRESS }}
          VITE_FACTORY_RELEASE_SUPPORTED: ${{ vars.VITE_FACTORY_RELEASE_SUPPORTED }}
          VITE_REQUIRE_VERIFY: ${{ vars.VITE_REQUIRE_VERIFY }}
          VITE_WORLD_ACTION_ID: ${{ vars.VITE_WORLD_ACTION_ID }}
          VITE_WORLD_APP_ID: ${{ vars.VITE_WORLD_APP_ID }}
          VITE_NOTIFY_BACKEND_URL: ${{ vars.VITE_NOTIFY_BACKEND_URL }}
          VITE_APP_ORIGIN: ${{ vars.VITE_APP_ORIGIN }}
        run: pnpm build

      - name: Verify the build actually got a factory address
        working-directory: app
        # vars 가 비어 있으면 VITE_FACTORY_ADDRESS 가 undefined 가 되어 흰 화면이 배포된다.
        # 번들에 실제 값이 들어갔는지 확인해 잘못된 배포를 막는다.
        run: |
          set -euo pipefail
          FACTORY="${{ vars.VITE_FACTORY_ADDRESS }}"
          if [ -z "$FACTORY" ]; then
            echo "::error::Repository variable VITE_FACTORY_ADDRESS 가 설정되지 않았습니다."; exit 1
          fi
          if ! grep -q "$FACTORY" dist/assets/*.js; then
            echo "::error::번들에서 VITE_FACTORY_ADDRESS 를 찾지 못했습니다. 빌드 설정을 확인하세요."; exit 1
          fi
          echo "빌드 확인 OK: $FACTORY"

      # 상속인에게 보내는 링크의 기준 주소.
      #
      # 이게 없으면 앱은 `window.location.origin` 으로 물러간다. World App 안에서 그 값은
      # **미니앱 래퍼** 일 수 있고, 그러면 "Copy link" 로 받은 상속인이 앱으로 못 간다.
      # 상속 절차에서 상속인에게 닿는 **유일한 확실한 채널** 이 이 링크이므로(알림은 상속인이
      # 이 앱을 깔았어야만 닿는다) 조용히 물러나는 것은 배포 후에도 원인을 알 수 없는
      # 고장으로 이어진다 — 그때는 "링크를 눌렀는데 앱이 안 떠요" 만 남는다.
      #
      # 그래서 미설정이면 **배포를 막는다.** 사이트는 정상적으로 올라가지만 링크만 고쳐야
      # 하므로, 증상은 Store 스크린샷과 실제 동작이 달라지는 것으로 나타난다.
      - name: Verify VITE_APP_ORIGIN reached the bundle
        working-directory: app
        run: |
          set -euo pipefail
          ORIGIN="${{ vars.VITE_APP_ORIGIN }}"
          if [ -z "$ORIGIN" ]; then
            echo "::error::Repository variable VITE_APP_ORIGIN 가 설정되지 않았습니다. 상속인 링크가 World App 래퍼를 가리킬 수 있습니다."; exit 1
          fi
          if ! grep -qF "$ORIGIN" dist/assets/*.js; then
            echo "::error::번들에서 VITE_APP_ORIGIN ($ORIGIN) 을 찾지 못했습니다. 빌드 설정을 확인하세요."; exit 1
          fi
          echo "상속인 링크 기준 주소 확인 OK: $ORIGIN"

      # workingDirectory 가 반드시 app 이어야 한다. Pages Functions(app/functions/)는
      # **작업 디렉터리** 기준으로 찾는다. 루트에서 `pages deploy app/dist` 를 쓰면
      # app/functions 를 못 찾아서 SIWE 로그인 엔드포인트가 조용히 사라진다 —
      # 사이트는 정상 배포되지만 /api/auth/* 가 404 가 되고 로그인이 안 된다.
      #
      # `pages deploy` 는 `--cwd` 를 받지 않으므로(step 마다 지정해야 한다)
      # action 의 workingDirectory 로 해결한다. repository 전체에 defaults 를 거는
      # 것은 이 action 을 망가뜨리므로 쓰지 않는다.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: pages deploy

  # 알림 백엔드. 별도 job 인 이유는 프론트엔드와 실패 조건이 다르기 때문이다 —
  # 프론트 배포가 성공해도 백엔드가 죽어 있으면 "알림이 안 온다" 는 형태로만 드러난다.
  notify:
    name: Deploy notification backend
    needs: auth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker execution dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Prepare dedicated execution signer
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FINALIZER_PRIVATE_KEY: ${{ secrets.FINALIZER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$FINALIZER_PRIVATE_KEY" || { echo "::error::The dedicated execution signer is missing"; exit 1; }
          printf '%s' "$FINALIZER_PRIVATE_KEY" | npx wrangler secret put FINALIZER_PRIVATE_KEY --config backend/wrangler.toml

      # 결정 함수 테스트만으로는 DB 쓰기 경로를 아무도 안 건드린다. 실제로
      # 자리표시자 13개에 바인딩 12개를 주는 saveWatcher 가 그 초록 상태로 배포돼
      # 금고 등록이 500 이고 알림이 한 번도 안 갔다. 그래서 배포 전에 돌린다.
      - name: Test notification decision logic
        run: node ../scripts/test-notify-alerts.mjs

      - name: Test notification DB writes
        run: node ../scripts/test-notify-db.mjs

      # wrangler 를 직접 부른다 (action 이 아니라). 토큰에 Workers Scripts 권한이 없으면
      # wrangler 는 "No access to the specified service" 라고만 말해서 무엇이 필요한지
      # 알기 어렵다. 여기서 그 오류를 잡아 요구사항을 그대로 말해 준다.
      #
      # `deploy --dry-run` 은 API 를 전혀 호출하지 않아 권한을 확인해 주지 못한다 —
      # 권한이 없어도 성공한다. 그래서 실제 API 를 때리는 명령으로 확인한다.
      - name: Deploy notification Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YIELD_FACTORY_ADDRESS: ${{ vars.VITE_YIELD_FACTORY_ADDRESS }}
          MORPHO_VAULT_ADDRESS: ${{ vars.VITE_MORPHO_VAULT_ADDRESS }}
        run: |
          set -uo pipefail
          DEPLOY_ARGS=()
          if [ -n "$YIELD_FACTORY_ADDRESS" ] || [ -n "$MORPHO_VAULT_ADDRESS" ]; then
            if [[ ! "$YIELD_FACTORY_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]] || [[ ! "$MORPHO_VAULT_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
              echo "::error::The yield factory and Morpho strategy must be configured together."; exit 1
            fi
            DEPLOY_ARGS+=(--var "YIELD_FACTORY_ADDRESS:$YIELD_FACTORY_ADDRESS" --var "MORPHO_VAULT_ADDRESS:$MORPHO_VAULT_ADDRESS" --var "FINALIZER_MAX_GAS:850000")
          fi
          LOG=$(mktemp)
          if npx wrangler deploy "${DEPLOY_ARGS[@]}" 2>&1 | tee "$LOG"; then
            echo "Worker 배포 완료"
          else
            if grep -qiE 'No access to the specified service|10000|not authorized' "$LOG"; then
              echo "::error::CLOUDFLARE_API_TOKEN 에 Workers Scripts:Edit 권한이 없습니다."
              echo "::error::Cloudflare → My Profile → API Tokens 에서 기존 토큰을 Edit 하거나,"
              echo "::error::'Workers Scripts: Edit' + 'D1: Edit' 를 포함한 새 토큰을 만들어"
              echo "::error::시크릿 CLOUDFLARE_API_TOKEN 을 갱신하세요."
              echo "::error::Pages 배포는 이 권한 없이 동작하므로 프론트만 올라간 상태로 남습니다 —"
              echo "::error::이러면 알림 백엔드 수정이 반영되지 않은 채로 프론트만 최신이 됩니다."
            fi
            exit 1
          fi

      # 배포가 성공했다고 DB 가 동작한다고는 보장되지 않는다. /api/health 로
      # 확인해 본다 — 여기가 조용히 깨지면 사용자는 알림이 조용히 안 오는 것만 안다.
      - name: Verify the deployed Worker answers
        run: |
          set -euo pipefail
          URL="https://world-inheritance-notify.rkddkwl725.workers.dev/api/health"
          for i in 1 2 3 4 5 6; do
            if BODY=$(curl -sf -m 20 "$URL"); then
              echo "$BODY"
              case "$BODY" in
                *'"status":"ok"'*) echo "Worker 확인 OK"; exit 0 ;;
                *) echo "::error::응답 형식이 이상합니다: $BODY"; exit 1 ;;
              esac
            fi
            echo "시도 $i 실패, 재시도…"; sleep 10
          done
          echo "::error::배포된 Worker 가 응답하지 않습니다."; exit 1
