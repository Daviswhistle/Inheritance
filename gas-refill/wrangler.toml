[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "GAS_REFILL_EXECUTOR"
class_name = "GasRefillExecutor"

[[migrations]]
tag = "gas-refill-executor-v1"
new_sqlite_classes = ["GasRefillExecutor"]

[[d1_databases]]
binding = "DB"
database_name = "world-inheritance-notify"
database_id = "3f42cdf7-9a53-409a-8f59-b27ef8ee631a"

[vars]
GAS_REFILL_ENABLED = "false"
