name = "world-inheritance-notify"
main = "src/runtime.mjs"
compatibility_date = "2026-02-26"

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "FINALIZER_EXECUTOR"
class_name = "InheritanceExecutor"

[[durable_objects.bindings]]
name = "WATCHER_TASKS"
class_name = "InheritanceWatcher"

[[migrations]]
tag = "inheritance-executor-v1"
new_sqlite_classes = ["InheritanceExecutor"]

[[migrations]]
tag = "inheritance-watchers-v1"
new_sqlite_classes = ["InheritanceWatcher"]

[[d1_databases]]
binding = "DB"
database_name = "world-inheritance-notify"
# 2026-09-27 에 wrangler d1 create 로 실제 생성.
database_id = "3f42cdf7-9a53-409a-8f59-b27ef8ee631a"
migrations_dir = "migrations"

[vars]
RPC_URL = "https://worldchain-mainnet.g.alchemy.com/public"
# Exact session audience and allowed browser origin; authentication also applies without Origin.
FRONTEND_ORIGIN = "https://inheritance.pages.dev"
FACTORY_ADDRESS = "0xb74342FC15C504108cFD91366493590A9d570D26"
# Keep the original factory trusted when FACTORY_ADDRESS advances to a reviewed release.
LEGACY_FACTORY_ADDRESS = "0xF7BeEDDeB8bE1DbC4Bd8768fC3f1e513DD6C1d88"
WLD_ADDRESS = "0x2cfc85d8e48f8eab294be644d9e25c3030863003"
# SIWE_SECRET is a secret, shared with Pages. Never put it in [vars].
# Set your app id here or with: wrangler secret put WORLD_APP_ID
# WORLD_APP_ID = "app_xxx"

# Dedicated gas-only executor. The key is a Worker secret, never a frontend variable.
FINALIZER_ENABLED = "true"
FINALIZER_CHAIN_ID = "480"
FINALIZER_BATCH_SIZE = "1"
FINALIZER_SCAN_LIMIT = "3"
FINALIZER_MAX_GAS = "250000"
FINALIZER_MAX_FEE_GWEI = "0.01"
FINALIZER_DAILY_GAS_CAP_ETH = "0.00001"
FINALIZER_EXTRA_FEE_RESERVE_ETH = "0.000001"
