name = "world-inheritance-notify"
main = "src/worker.mjs"
compatibility_date = "2026-02-26"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "world-inheritance-notify"
# 2026-09-27 에 wrangler d1 create 로 실제 생성.
database_id = "3f42cdf7-9a53-409a-8f59-b27ef8ee631a"
migrations_dir = "migrations"

[vars]
RPC_URL = "https://worldchain-mainnet.g.alchemy.com/public"
# Optional: set to exact frontend origin to restrict CORS.
# FRONTEND_ORIGIN = "https://<your-miniapp-domain>"
# Set your app id here or with: wrangler secret put WORLD_APP_ID
# WORLD_APP_ID = "app_xxx"
