<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inheritance 계약 배포</title><style>body{font:16px system-ui;max-width:680px;margin:auto;padding:24px;color:#172235;background:#f7f9fc}section{background:white;border:1px solid #ddd;border-radius:16px;padding:18px;margin:18px 0}button{font:inherit;border:0;border-radius:12px;padding:14px;background:#243de4;color:white;margin:6px 0;min-height:48px}button:disabled{background:#8b91a3}pre,code{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}dt{font-weight:600}dd{margin:6px 0 14px;overflow-wrap:anywhere}details{margin:14px 0}#status,#identity{white-space:pre-wrap;overflow-wrap:anywhere}h1{font-size:26px}</style><h1>배포 비용 보내기</h1><p id="build-version"></p><p>World App의 WETH 중 0.00004 ETH를 배포 전용 임시 지갑으로 보냅니다. 이 지갑에서 두 계약의 배포 비용을 지불합니다. 계약 수수료 수령 지갑은 기존 World App 지갑으로 유지됩니다. 최종 전송은 World App 승인 화면에서 확인하세요. 연결된 한 대의 World App에서만 진행하고 다른 기기에서는 같은 전송을 요청하지 마세요.</p><section><dl id="identity"></dl><button id="auth">World App 지갑 확인</button><button id="refresh">전송 상태 조회</button><p id="status" role="status"></p><details id="diagnostic-panel" hidden><summary>오류 원인 확인</summary><pre id="diagnostics"></pre></details></section><main id="rows"></main><script type="module" src="/operator-fund.js"></script></html>
