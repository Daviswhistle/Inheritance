# Cloudflare Pages — 사이트와 서버 함수를 함께 배포한다.
#
# Pages와 알림 Worker는 일회용 nonce, 요청 제한, 알림 상태를 같은 D1에 저장한다.
name = "inheritance"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

# FRONTEND_ORIGIN 은 사이트 주소 그대로. SIWE 도메인 검증과 CORS 허용에 쓰인다.
[vars]
FRONTEND_ORIGIN = "https://inheritance.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "world-inheritance-notify"
database_id = "3f42cdf7-9a53-409a-8f59-b27ef8ee631a"
migrations_dir = "../backend/migrations"

# SIWE_SECRET 은 반드시 secret 으로 넣는다 (wrangler secret put SIWE_SECRET).
# Pages와 Worker가 공유하는 1시간 세션 서명 키이므로 공개되면 로그인이 무력화된다.
