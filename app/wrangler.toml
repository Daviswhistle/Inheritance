# Cloudflare Pages — 사이트와 서버 함수를 함께 배포한다.
#
# SIWE 로그인 검증은 Pages Functions 로 넣었다. 별도 Workers 로 분리하면
# D1 database_id 가 자리표시자 상태라 라이브에 못 올리고, 무엇보다 배포가
# 두 번으로 갈라진다. 사이트와 같은 배포에 묶으면 항상 함께 올라간다.
name = "inheritance"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

# FRONTEND_ORIGIN 은 사이트 주소 그대로. SIWE 도메인 검증과 CORS 허용에 쓰인다.
[vars]
FRONTEND_ORIGIN = "https://inheritance.pages.dev"

# SIWE_SECRET 은 반드시 secret 으로 넣는다 (wrangler secret put SIWE_SECRET).
# 서명된 nonce 를 발급하는 키이므로 공개되면 로그인 무력화된다.
