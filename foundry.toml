[profile.default]
# New security-remediated generation only. Existing immutable deployments were
# built with 0.8.24, legacy codegen; use their source revision when verifying them.
solc_version = "0.8.38"
via_ir = true
src = "contracts"
test = "test"
script = "script"
libs = ["lib"]
out = "out"
optimizer = true
optimizer_runs = 200
# World Chain (OP Stack) EVM version.
evm_version = "cancun"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Critical custody line coverage is enforced by scripts/check-custody-coverage.mjs
# in CI. Foundry does not recognize fail_under or exclude_patterns here.
[profile.default.fuzz]
runs = 256

# Reproduce historical deployment artifacts with the corresponding old source.
[profile.legacy]
solc_version = "0.8.24"
via_ir = false
